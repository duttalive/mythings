name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Local-only settings (open sign-ups, in-memory mailbox) for tests.
      - run: cp .dev.vars.example .dev.vars
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Uses the Google Chrome that GitHub's Ubuntu runners come with.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
