name: Bug report
description: Something in mythings doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security problems, don't use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Today
        2. Add a to-do called "call mum tomorrow"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you using mythings?
      options:
        - The hosted instance (mythings.dynocoder.com)
        - My own deployment
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings → About.
      placeholder: "1.2.1"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Safari on iPhone (installed app), Chrome 140 on macOS, ..."
    validations:
      required: true
  - type: dropdown
    id: offline
    attributes:
      label: Were you offline, or using more than one device?
      options:
        - "No"
        - Offline at the time
        - Several devices
        - Not sure
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors. Please leave out personal to-dos and account details.
